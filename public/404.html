<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><script>
(function(){
  var path=window.location.pathname.replace(/^\//,'');
  var target='/?route='+encodeURIComponent(path)+(window.location.search?'&'+window.location.search.slice(1):'')+window.location.hash;
  window.location.replace(target);
})();
</script></head><body></body></html>
