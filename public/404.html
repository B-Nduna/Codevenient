<!doctype html><html><head><meta charset="utf-8"><script>
(function(){
  var base='/Codevenient/';
  var path=window.location.pathname;
  var route=path.startsWith(base)?path.slice(base.length):path.replace(/^\//,'');
  var target=base+'?route='+encodeURIComponent(route)+(window.location.search?'&'+window.location.search.slice(1):'')+window.location.hash;
  window.location.replace(target);
})();
</script></head><body></body></html>
